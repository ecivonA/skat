# In eurem Repo ablegen unter: .github/workflows/keep-alive.yml
# Zusätzlich als Repo-Secret anlegen: SUPABASE_ANON_KEY, SUPABASE_URL
# (Settings -> Secrets and variables -> Actions -> New repository secret)

name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 6 */5 * *'   # alle 5 Tage, morgens 06:00 UTC
  workflow_dispatch:         # manuell auslösbar zum Testen

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/tables?select=code&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
