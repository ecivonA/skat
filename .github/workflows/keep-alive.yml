# Pingt Supabase alle 5 Tage, damit das Free-Tier-Projekt nicht nach 7 Tagen pausiert.
# URL und Anon-/Publishable-Key werden direkt aus sync.js gelesen (sind dort ohnehin öffentlich),
# daher sind keine Repo-Secrets nötig und Workflow + App können nicht auseinanderlaufen.

name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 6 */5 * *'   # alle 5 Tage, morgens 06:00 UTC
  workflow_dispatch:         # manuell auslösbar zum Testen

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: sync.js
          sparse-checkout-cone-mode: false

      - name: Ping Supabase
        run: |
          URL=$(grep -oP "SUPABASE_URL\s*=\s*'\K[^']+" sync.js)
          KEY=$(grep -oP "SUPABASE_ANON_KEY\s*=\s*'\K[^']+" sync.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::SUPABASE_URL oder SUPABASE_ANON_KEY nicht in sync.js gefunden"
            exit 1
          fi
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 \
            "$URL/rest/v1/tables?select=code&limit=1" \
            -H "apikey: $KEY")
          echo "HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Supabase antwortete mit HTTP $CODE"
            exit 1
          fi
